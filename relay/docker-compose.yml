# Self-host the Bun variant. From this directory: `docker compose up --build`.
# The relay listens on plain HTTP; put it behind a reverse proxy (Caddy,
# nginx, Traefik) for TLS if it's reachable from the internet. See README.md
# "Self-host with Docker" for the full walkthrough.
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: latch-relay:local
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      # The APNs signing key enables the push doorbell; it is entirely
      # optional (the relay works with plain deposit/drain and the phone's
      # own poll backstop without it). Never bake it into the image. Enable
      # it one of two ways, never both:
      #
      #   1. (preferred) Mount the .p8 file read-only and point
      #      APNS_KEY_P8_PATH at the mounted path:
      # APNS_KEY_P8_PATH: /run/secrets/apns_key.p8
      #
      #   2. Or set APNS_KEY_P8 directly to the PEM text. Avoid this in
      #      production: the value then shows up in `docker inspect` and the
      #      container's process environment.
      # APNS_KEY_P8: ""
    # Uncomment alongside APNS_KEY_P8_PATH above. Put your own .p8 file next
    # to this compose file (it is not part of the image; keep it out of git).
    # volumes:
    #   - ./AuthKey.p8:/run/secrets/apns_key.p8:ro
    healthcheck:
      test: ["CMD", "bun", "run", "bun/healthcheck.ts"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
