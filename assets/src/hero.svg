<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="1600" height="900" fill="#000000"/>
<rect x="72" y="82" width="40" height="40" rx="4" fill="#FFFFFF" transform="rotate(45 92 102)"/>
<text x="144" y="116" fill="#FFFFFF" font-size="46">Sigil</text>
<text x="72" y="238" fill="#FFFFFF" font-size="54">Your agent can ask for a secret.</text>
<text x="72" y="302" fill="#8A8A8E" font-size="54">It cannot take one.</text>
<rect x="72" y="458" width="1078" height="320" rx="20" fill="#0A0A0A" stroke="#2C2C2E" stroke-width="2"/>
<text x="108" y="602" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="26" xml:space="preserve"><tspan fill="#8A8A8E">$  </tspan><tspan fill="#FFFFFF">op read op://Engineering/.env/API_KEY</tspan></text>
<text x="108" y="648" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="26" fill="#8A8A8E" xml:space="preserve">   waiting for approval on your phone</text>
<rect x="1206" y="408" width="322" height="420" rx="40" fill="#0A0A0A" stroke="#2C2C2E" stroke-width="2"/>
<rect x="1333" y="428" width="68" height="8" rx="4" fill="#2C2C2E"/>
<text x="1234" y="512" fill="#8A8A8E" font-size="19" letter-spacing="2">APPROVE</text>
<text x="1234" y="566" fill="#FFFFFF" font-size="26">.env</text>
<text x="1234" y="604" fill="#8A8A8E" font-size="20" font-family="ui-monospace, SF Mono, Menlo, monospace">Engineering</text>
<rect x="1234" y="646" width="266" height="64" rx="32" fill="#FFFFFF"/>
<text x="1367" y="686" fill="#000000" font-size="25" text-anchor="middle">Approve once</text>
<rect x="1234" y="724" width="266" height="64" rx="32" fill="none" stroke="#2C2C2E" stroke-width="2"/>
<text x="1367" y="764" fill="#8A8A8E" font-size="25" text-anchor="middle">Deny</text>
</svg>