name: release

# Tag-triggered: `git tag v0.2.0 && git push origin v0.2.0`. Every publishing
# job below is gated on the secret(s) it needs (see docs/RELEASE.md for the
# full checklist), so this workflow is safe to merge before any secret exists:
# a job whose secret is missing logs a warning and no-ops its remaining steps
# (still reports success, never failure), and the jobs that need no secret
# (the CLI build) still run and still produce a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release, upload assets
  packages: write # push the relay image to GHCR

jobs:
  # ---------------------------------------------------------------------
  # CLI: cross-compiled `sigil` + `sigil-config`, tarball + sha256 per arch.
  # No secrets needed - always runs.
  # ---------------------------------------------------------------------
  rust-cli:
    name: cli (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/release/package-cli.sh ${{ matrix.target }} ${{ github.ref_name }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Combine both archs' checksums into one file and render the (unpublished)
  # Homebrew formula. Always runs; depends only on rust-cli.
  cli-release-assets:
    name: cli (checksums + homebrew formula)
    needs: rust-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: combined checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS.txt
      - name: render homebrew formula (unpublished - see docs/RELEASE.md)
        run: |
          ./scripts/release/render-homebrew-formula.sh \
            "${{ github.ref_name }}" "${{ github.repository }}" dist/sigil.rb dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-assets
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS.txt
            dist/sigil.rb
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # iOS: Sigil -> TestFlight. Needs the Rainnworks App Store Connect API key.
  # ---------------------------------------------------------------------
  ios:
    name: ios (TestFlight)
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    steps:
      # Step (not job) `if:` cannot read the `secrets` context directly (a
      # GitHub Actions restriction - actionlint flags it); the job-level
      # `env:` block above mirrors each secret so steps gate on `env.*`
      # instead.
      - name: skip if secrets are not configured yet
        if: ${{ env.ASC_API_KEY_P8 == '' }}
        run: |
          echo "::warning::ASC_API_KEY_P8 not set - skipping the iOS TestFlight upload. See docs/RELEASE.md."
          exit 0
      - uses: actions/checkout@v4
        if: ${{ env.ASC_API_KEY_P8 != '' }}
      - uses: ruby/setup-ruby@v1
        if: ${{ env.ASC_API_KEY_P8 != '' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: fastlane
      - uses: oven-sh/setup-bun@v2
        if: ${{ env.ASC_API_KEY_P8 != '' }}
      - name: bun install
        if: ${{ env.ASC_API_KEY_P8 != '' }}
        working-directory: apps/phone
        run: bun install --frozen-lockfile
      # apps/phone/ios is gitignored (Expo CNG, see apps/phone/.gitignore) -
      # regenerate the native project fresh from app.json for every release.
      - name: expo prebuild
        if: ${{ env.ASC_API_KEY_P8 != '' }}
        working-directory: apps/phone
        run: bunx expo prebuild -p ios
      - name: pod install
        if: ${{ env.ASC_API_KEY_P8 != '' }}
        working-directory: apps/phone/ios
        run: pod install
      - name: fastlane ios beta
        if: ${{ env.ASC_API_KEY_P8 != '' }}
        run: bundle exec fastlane ios beta
        working-directory: fastlane

  # ---------------------------------------------------------------------
  # macOS: Latch configurator -> notarized, stapled DMG. Needs its own ASC
  # API key (see fastlane/Fastfile's comment: separate team from iOS until
  # #35 migrates the Mac identity to Rainnworks).
  # ---------------------------------------------------------------------
  mac:
    name: mac (notarized DMG)
    runs-on: macos-latest
    env:
      MAC_ASC_KEY_ID: ${{ secrets.MAC_ASC_KEY_ID }}
      MAC_ASC_ISSUER_ID: ${{ secrets.MAC_ASC_ISSUER_ID }}
      MAC_ASC_API_KEY_P8: ${{ secrets.MAC_ASC_API_KEY_P8 }}
      MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
    steps:
      - name: skip if secrets are not configured yet
        if: ${{ env.MAC_ASC_API_KEY_P8 == '' }}
        run: |
          echo "::warning::MAC_ASC_API_KEY_P8 not set - skipping the macOS build/notarize. See docs/RELEASE.md."
          exit 0
      - uses: actions/checkout@v4
        if: ${{ env.MAC_ASC_API_KEY_P8 != '' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ env.MAC_ASC_API_KEY_P8 != '' }}
      - uses: ruby/setup-ruby@v1
        if: ${{ env.MAC_ASC_API_KEY_P8 != '' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: fastlane
      - name: brew install xcodegen
        if: ${{ env.MAC_ASC_API_KEY_P8 != '' }}
        run: brew install xcodegen
      - name: fastlane mac release
        if: ${{ env.MAC_ASC_API_KEY_P8 != '' }}
        run: bundle exec fastlane mac release
        working-directory: fastlane
      - uses: actions/upload-artifact@v4
        if: ${{ env.MAC_ASC_API_KEY_P8 != '' }}
        with:
          name: mac-dmg
          path: build/mac/Latch.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Relay: static x86_64-unknown-linux-musl binary of the native Rust relay
  # (crates/sigil-relay). No secrets needed - always runs, and its artifact
  # is both attached to the GitHub Release and consumed by relay-deploy-gcp.
  # ---------------------------------------------------------------------
  relay-build:
    name: relay (musl binary)
    runs-on: ubuntu-latest
    env:
      # ring (via rustls) needs a musl C toolchain to cross-compile; musl-tools
      # provides musl-gcc. Point both the linker and ring's build cc at it.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build static relay binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p sigil-relay
      - name: stage artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/sigil-relay \
            dist/sigil-relay-x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: relay-musl
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Relay: deploy the musl binary to the self-hosted GCP box (see
  # deploy/gcp/). Gated on the deploy secrets: with any of them missing this
  # logs a warning and no-ops (still reports success), so it is inert until
  # the secrets exist and never fails a run. RELAY_DEPLOY_HOST is the public
  # relay hostname, reachable over https for the healthcheck and over ssh
  # (:22) for the copy; RELAY_DEPLOY_USER/RELAY_DEPLOY_SSH_KEY authenticate
  # the copy. No real host, user, or key value lives in this file.
  # ---------------------------------------------------------------------
  relay-deploy-gcp:
    name: relay (deploy to gcp)
    needs: relay-build
    runs-on: ubuntu-latest
    env:
      RELAY_DEPLOY_SSH_KEY: ${{ secrets.RELAY_DEPLOY_SSH_KEY }}
      RELAY_DEPLOY_HOST: ${{ secrets.RELAY_DEPLOY_HOST }}
      RELAY_DEPLOY_USER: ${{ secrets.RELAY_DEPLOY_USER }}
    steps:
      - name: skip if secrets are not configured yet
        if: ${{ env.RELAY_DEPLOY_SSH_KEY == '' || env.RELAY_DEPLOY_HOST == '' || env.RELAY_DEPLOY_USER == '' }}
        run: |
          echo "::warning::RELAY_DEPLOY_* not fully set - skipping the GCP relay deploy. See deploy/gcp/README.md."
          exit 0
      - uses: actions/download-artifact@v4
        if: ${{ env.RELAY_DEPLOY_SSH_KEY != '' && env.RELAY_DEPLOY_HOST != '' && env.RELAY_DEPLOY_USER != '' }}
        with:
          name: relay-musl
          path: dist
      - name: configure ssh
        if: ${{ env.RELAY_DEPLOY_SSH_KEY != '' && env.RELAY_DEPLOY_HOST != '' && env.RELAY_DEPLOY_USER != '' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$RELAY_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$RELAY_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: copy binary, install, restart
        if: ${{ env.RELAY_DEPLOY_SSH_KEY != '' && env.RELAY_DEPLOY_HOST != '' && env.RELAY_DEPLOY_USER != '' }}
        run: |
          bin=dist/sigil-relay-x86_64-unknown-linux-musl
          chmod +x "$bin"
          scp -i ~/.ssh/deploy_key "$bin" \
            "$RELAY_DEPLOY_USER@$RELAY_DEPLOY_HOST:/tmp/sigil-relay.new"
          ssh -i ~/.ssh/deploy_key "$RELAY_DEPLOY_USER@$RELAY_DEPLOY_HOST" \
            'sudo install -m 0755 /tmp/sigil-relay.new /usr/local/bin/sigil-relay \
             && rm -f /tmp/sigil-relay.new \
             && sudo systemctl restart sigil-relay'
      - name: healthcheck
        if: ${{ env.RELAY_DEPLOY_SSH_KEY != '' && env.RELAY_DEPLOY_HOST != '' && env.RELAY_DEPLOY_USER != '' }}
        run: |
          ok=
          for _ in $(seq 1 10); do
            if curl -fsS "https://$RELAY_DEPLOY_HOST/health" | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::relay /health did not report healthy after restart"
            exit 1
          fi
          echo "relay /health ok; version:"
          curl -fsS "https://$RELAY_DEPLOY_HOST/version"

  # ---------------------------------------------------------------------
  # Relay: Docker image of the native Rust relay -> GHCR. Builds
  # crates/sigil-relay/Dockerfile (static musl binary in scratch); context is
  # the repo root so relay/landing.html is available to include_str!. Only
  # needs the built-in GITHUB_TOKEN (packages: write, granted above), so this
  # always runs on a tag.
  # ---------------------------------------------------------------------
  relay-docker:
    name: relay (docker -> ghcr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lowercase the image owner (GHCR requires it)
        id: owner
        run: echo "lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/sigil-relay/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/sigil-relay:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.lower }}/sigil-relay:latest

  # ---------------------------------------------------------------------
  # Publish the GitHub Release once whatever above ran settles. `ios`, `mac`,
  # and `relay-deploy-gcp` report *success* even when their secret is missing
  # (they early-exit a step with a warning rather than failing the job - see
  # each job's first step), so `needs` is satisfied either way; `!cancelled()`
  # just makes sure a genuine failure elsewhere still stops the release. The
  # static relay binary from relay-build is attached alongside the CLI assets.
  # ---------------------------------------------------------------------
  github-release:
    name: github release
    needs: [cli-release-assets, ios, mac, relay-build, relay-deploy-gcp, relay-docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-release-assets
          path: release-assets
      - uses: actions/download-artifact@v4
        continue-on-error: true # absent when the mac job was skipped
        with:
          name: mac-dmg
          path: release-assets
      - uses: actions/download-artifact@v4
        continue-on-error: true # the static relay binary
        with:
          name: relay-musl
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
