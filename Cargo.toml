[workspace]
resolver = "2"
members = ["crates/sigil-proto", "crates/sigil", "crates/sigil-softphone", "crates/sigil-relay-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
crypto_box = { version = "0.9", features = ["std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
anyhow = "1"
blake2 = "0.10"
base64 = "0.22"
libc = "0.2"
tokio = { version = "1", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
