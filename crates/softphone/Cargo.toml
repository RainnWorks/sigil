[package]
name = "sigil-softphone"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless reference approver: the phone side of the Sigil protocol, as a library and CLI"

# The library holds the approver logic (pairing consumption, request open,
# policy, response seal) so both the CLI and the daemon's e2e test drive it.
[lib]
name = "sigil_softphone"
path = "src/lib.rs"

[[bin]]
name = "sigil-softphone"
path = "src/main.rs"

[dependencies]
sigil-proto = { path = "../proto" }
# thiserror: typed library errors across the proto seams (pairing, envelope,
# transport). anyhow only at the binary edge, per house rules.
thiserror.workspace = true
anyhow.workspace = true
# serde_json + base64: the CLI serializes a PairingResponse to a base64url line
# for interop with a real daemon QR.
serde_json.workspace = true
base64.workspace = true
