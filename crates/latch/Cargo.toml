[package]
name = "latch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Latch daemon, op shim, and CLI as one multicall binary"

# A library target holds all the modules so unit tests and the seam traits are
# public API (a binary-only crate would flag every test-only helper as dead).
[features]
# real-relay: opt-in the e2e tests that spawn an external `bun` relay process and
# drive a real WebSocket round-trip. They are excluded from a plain `cargo test`
# for two reasons: they need `bun` + the relay script on the box, and several of
# them contend on ephemeral ports / relay processes and deadlock when run in
# parallel with each other. Run them serially on a Mac that has bun:
#   cargo test -p latch --features real-relay -- --test-threads=1
real-relay = []

[lib]
name = "latch"
path = "src/lib.rs"

[[bin]]
name = "latch"
path = "src/main.rs"

[dependencies]
latch-proto = { path = "../proto" }
# latch-relay-client: the daemon's outbound-WebSocket Transport to the blind
# relay, wired behind the phone approving factor at arm time.
latch-relay-client = { path = "../relay-client" }
serde.workspace = true
serde_json.workspace = true
# anyhow only at the binary edge, per house rules.
anyhow.workspace = true
# thiserror: typed errors for the keystore/secrets/lease library seams.
thiserror.workspace = true
# libc: SCM_RIGHTS fd passing (op stdout/stderr wired straight to the caller,
# never through daemon memory), unix socket/dir permission bits, socket peer
# pid (LOCAL_PEERPID), and kernel-side process ancestry (sysctl KERN_PROC).
libc.workspace = true
# zeroize: DEK and decrypted-token buffers are wiped on drop; audited per path.
zeroize.workspace = true
# aes-gcm 0.10: AES-256-GCM for service-account tokens at rest under the DEK.
# Pinned to 0.10 so it shares aead 0.5 with crypto_box already in the tree.
aes-gcm = "0.10"
# rand_core: CSPRNG (OsRng) for DEK and nonce generation. Same crate/features
# the proto identity keys already use.
rand_core.workspace = true
# blake2: grant-key derivation over the verified caller ancestry chain.
blake2.workspace = true
# base64: encode token ciphertext for the plaintext-safe JSON account store.
base64.workspace = true
# uuid v7: per-approval ids used to address a pending local approval.
uuid.workspace = true
# tokio: async accept loop for the daemon only; the shim path never builds a
# runtime. Feature set kept to the listener plus signal handling.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
# latch-relay-client already provides the daemon WS transport; the softphone is
# a dev-dep. The pairing rendezvous uses relay-client's raw Rendezvous client.
# qrcode: encode the module matrix for `latch qr` and the pairing QR.
# default-features off drops the `image`/`svg` render backends and the whole
# `image` dependency stack; we use only the matrix (`QrCode::to_colors`) and
# render it ourselves in `src/qr.rs` (unicode half-blocks, a from-scratch
# grayscale PNG, and SVG), so no image stack enters the single binary.
qrcode = { version = "0.14", default-features = false }
# ssh-key 0.6: decode the `-----BEGIN OPENSSH PRIVATE KEY-----` body the service
# account hands us, emit the public-key wire blob for IDENTITIES_ANSWER, and sign
# via ed25519-dalek (already vendored; ssh-key delegates to it). ed25519-only in
# v1, so no rsa/ecdsa/dsa features. `alloc` enables from_openssh + the Signer impl.
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "alloc"] }
# signature 2: the `Signer` trait ssh-key's PrivateKey implements; same crate and
# version ssh-key pulls, brought in-scope to call `.try_sign` on the fetched key.
signature = "2"
# sha2 0.10: SHA-256 fingerprints of the host key and the data-to-sign for the
# approval screen (matches `ssh-keygen -l`). Already in-tree transitively via
# ssh-key; taken as a direct dep so the agent can hash arbitrary sign-data.
sha2 = "0.10"

# latch-softphone: the reference approver, used by the remote e2e integration
# test to stand in for a paired phone. Dev-only; never linked into the daemon.
[dev-dependencies]
latch-softphone = { path = "../softphone" }
# ed25519-dalek: cryptographically verify the agent's SSH signatures in tests
# (raw ed25519 over the challenge), against the served public key. Already in the
# tree via ssh-key/proto; a dev-dep so it never adds to the shipped binary.
ed25519-dalek = { workspace = true }

# security-framework: macOS Keychain blob storage and the Secure Enclave seam.
# macOS-only so Linux/Windows fills stay dependency-free.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"
