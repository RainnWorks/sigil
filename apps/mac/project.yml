# xcodegen spec for the Sigil Mac app.
#
# Why xcodegen over a raw Swift Package: a menubar + configurator app needs an
# app *bundle* (Info.plist with LSUIElement, an entitlements file for the Secure
# Enclave / keychain-access-group, a MenuBarExtra agent app) that SwiftPM's
# executable target cannot express. project.yml is a small, reviewable, in-repo
# source of truth that regenerates the .xcodeproj deterministically:
#   cd apps/mac && xcodegen generate
#
# Apple identity (mirrors apps/phone/app.config.js): the official build ships
# Rainnworks' identity, but the bundle id and team id are indirected through the
# SIGIL_MAC_BUNDLE_ID / SIGIL_MAC_TEAM_ID build settings so a self-hoster can
# retarget their own Apple account without editing this file. Both default to the
# Rainnworks values below, so a bare `xcodegen generate` needs no env. Override at
# build time (xcodebuild/gym) with `SIGIL_MAC_BUNDLE_ID=... SIGIL_MAC_TEAM_ID=...`;
# the fastlane :release lane wires those from the same-named env vars.
name: Sigil
options:
  bundleIdPrefix: works.rainn.sigil
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    PRODUCT_NAME: Sigil
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Apple identity defaults (Rainnworks). Overridable at build time by passing
    # these as build settings, e.g. `xcodebuild ... SIGIL_MAC_BUNDLE_ID=...`.
    SIGIL_MAC_BUNDLE_ID: works.rainn.sigil.mac
    SIGIL_MAC_TEAM_ID: 53W966FBFP
targets:
  Sigil:
    type: application
    platform: macOS
    sources:
      - path: Sigil
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: Sigil/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sigil/App/Sigil.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(SIGIL_MAC_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(SIGIL_MAC_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
